<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      color: #1a202c;
      min-height: 100vh;
      display: flex;

      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
